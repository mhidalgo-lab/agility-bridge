# agility-bridge behind Caddy (automatic HTTPS) — docs/guide/self-hosting.md.
#   1. Put your host name in Caddyfile and in AB_PUBLIC_URL below.
#   2. agility-bridge init --key-file ./secrets/master.key
#      agility-bridge admin-token > ./secrets/admin.token
#      sudo chown 65532:65532 ./secrets/* && chmod 600 ./secrets/*   (the image runs as uid 65532)
#   3. docker compose up -d
# The published image (P2-18), pinned by digest: verify it first (docs/guide/verify-release.md#the-docker-image), and
# pin the new digest when you upgrade. To run an image built from this repository instead, replace `image:` with
#   build: { context: .., dockerfile: docker/Dockerfile }
services:
  agility-bridge:
    image: ghcr.io/mhidalgo-lab/agility-bridge:0.8.0@sha256:6ecf6d95adf6277f3471d71036d60c440ea4ca9ca637ad250d4a8c7a980d09fd
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AB_PUBLIC_URL: https://mcp.example.com
      AB_TRUSTED_PROXY_HOPS: '1'
      AB_MASTER_KEY_FILE: /run/secrets/master.key
      AB_ADMIN_TOKEN_FILE: /run/secrets/admin.token
    volumes:
      - agility-bridge-data:/data
      # Secrets outside the data volume (L-074): a backup of the volume never holds the key.
      - ./secrets/master.key:/run/secrets/master.key:ro
      - ./secrets/admin.token:/run/secrets/admin.token:ro
    expose:
      - '8787'

  caddy:
    image: caddy:2.11-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - agility-bridge

volumes:
  agility-bridge-data:
  caddy-data:
