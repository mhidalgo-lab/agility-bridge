# The documentation site is its own pnpm workspace root (P9-04): the root workspace and its CI jobs never install it.
# Same supply-chain settings as the root (THREAT_MODEL T18, L-132).
packages: []
minimumReleaseAge: 4320
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
