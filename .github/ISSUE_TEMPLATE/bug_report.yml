name: Bug report
description: Something doesn't work as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Don't file it here — use private reporting (see SECURITY.md).
        Never paste Agility access tokens, `ab_` device tokens, instance URLs you can't share, or any Agility content
        (titles, descriptions, comments, member names or emails).
  - type: input
    id: version
    attributes: { label: agility-bridge version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options: [stdio (npx), Node serve, Docker, Cloudflare Worker]
    validations: { required: true }
  - type: dropdown
    id: installation
    attributes:
      label: Agility installation
      options: [Hosted (v1host.com), On-premises, Don't know]
  - type: input
    id: client
    attributes: { label: MCP client and version, placeholder: "Claude Code 2.x" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: Steps to reproduce, expected vs actual }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs (redacted), render: text }
