# Live suite against the read-only Agility tenant (P0-12, D-01, THREAT_MODEL A15). Manual only: never on pull requests or
# forks. The `live` environment allows `main` only and needs the owner's approval; its AB_LIVE_* secrets reach no other
# job. Every request goes through live/readonly-fetch.ts, and the suite prints nothing from the tenant (public logs).
name: Live

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: Live suite (read-only tenant)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
        env:
          AB_LIVE_AGILITY_URL: ${{ secrets.AB_LIVE_AGILITY_URL }}
          AB_LIVE_AGILITY_TOKEN: ${{ secrets.AB_LIVE_AGILITY_TOKEN }}
