# Release (P1-15). Adapted from relic-bridge's audited pipeline. Actions are pinned by commit SHA; Renovate keeps them updated.
#
# Flow: a changeset on `main` → the `version` job opens/updates the "Version Packages" PR. Merging it leaves no
# changesets and a version npm doesn't have (`plan` mode `publish`) → the `build` job installs, checks, builds and
# packs `agility-bridge` and uploads the tarball, SBOM and SHA256SUMS → the `publish` job verifies them, attests,
# stages the tarball on npm with trusted publishing (OIDC, no npm token; a maintainer approves it with 2FA on
# npmjs.com) and, once the version is live, creates the GitHub Release `v<version>`.
# Mode `release` (version on npm, no GitHub Release: an earlier run failed after the version went live) rebuilds, checks the
# tarball is identical to the one on npm and creates only the GitHub Release (this is also the run after a staged
# version was approved on npmjs.com).
#
# Backports: the same flow runs on a `release/x.y` branch (created on demand from a release tag, protected by a
# ruleset like `main`). `plan` refuses any other ref and a version outside `x.y`; a backport is staged with the npm
# dist-tag `release-x.y` (never `latest`) and its GitHub Release is not marked latest. docs/dev/releasing.md.
#
# Safety rails (THREAT_MODEL T18): never runs on pull requests; build/publish run only on `main` or `release/*`, only
# when the repository variable AB_RELEASE_ENABLED is 'true', and publish only after a reviewer approves the protected `release`
# environment. The version goes live only after a second approval with 2FA on npmjs.com. Only the `publish` and `image`
# jobs can mint an OIDC token, and they never check out the repository, install dependencies or run project code
# (scripts/test/release.test.ts asserts this).
#
# Image (P2-18, D-25): `image-build` builds the linux/amd64 + linux/arm64 image as an OCI archive and smoke-tests and
# scans the archived amd64 image; `image` (same `release` approval) pushes it to ghcr.io/mhidalgo-lab/agility-bridge
# once the version is live on npm, tags X.Y.Z, X.Y and latest (never backwards, never latest from a backport) and
# attests provenance and SBOM to the registry. `plan` and `publish` refuse a `v<version>` tag that points at another
# commit.
name: Release

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      npm-tag: ${{ steps.plan.outputs.npm-tag }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Pending changesets, unpublished version or missing GitHub Release?
        # Explicit bash enables pipefail, so a failing plan fails the step instead of passing with empty outputs.
        # No dependencies are installed: release.ts only uses Node built-ins, npm and gh (read-only token).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts plan | tee -a "$GITHUB_OUTPUT"

  version:
    name: Version PR
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Full history: `changeset version` otherwise deepens the shallow clone with `git fetch`, which has no
      # credentials here (persist-credentials: false) and fails on a private repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Commits through the GitHub API (signed by GitHub), so no git credentials are persisted in the checkout.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          # DCO check (ci.yml) needs a Signed-off-by trailer on every commit, including this bot commit.
          commit-message: |
            chore(release): version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          pr-title: 'chore(release): version packages'

  # Everything that runs dependency or project code lives here, without `id-token` and with a read-only token.
  build:
    name: Build release artifacts
    needs: plan
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      vars.AB_RELEASE_ENABLED == 'true' &&
      (needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sums-sha256: ${{ steps.sums.outputs.sums-sha256 }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in the release jobs: a poisoned cache must not reach the published build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Re-check the planned version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          test "$(node -p 'require("./apps/cli/package.json").version')" = "$VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Release build
        run: pnpm build
      - name: Pack and verify the tarball
        run: node scripts/check-package.ts --out release
      - name: Release notes
        run: |
          mkdir -p release-meta
          node scripts/release.ts notes "$VERSION" > release-meta/release-notes.md
      - id: sums
        name: SBOM and checksums
        run: |
          pnpm --filter agility-bridge sbom --sbom-format cyclonedx --sbom-type application --prod \
            --out "release/agility-bridge-${VERSION}.cdx.json"
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
          echo "sums-sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: |
            release/
            release-meta/
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC token. No checkout, no install, no project scripts: only setup-node, the artifact, sha256sum, npm
  # and gh. Keep it that way (scripts/test/release.test.ts fails otherwise).
  publish:
    name: Stage on npm and release on GitHub
    needs: [plan, build]
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      vars.AB_RELEASE_ENABLED == 'true' &&
      (needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/agility-bridge
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm trusted publishing + provenance, Sigstore attestations
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MODE: ${{ needs.plan.outputs.mode }}
      NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
    steps:
      # Egress blocked: the allowlist is every endpoint this job reaches (audited on relic-bridge's release runs with the
      # same job; harden-runner agent log in the job's post step). harden-runner also allows
      # GitHub's own Actions endpoints implicitly (artifact storage, results receiver, *.actions.githubusercontent.com).
      # Classes: GitHub API and release upload (api, uploads); OIDC token (token.actions); npm (registry, also used for
      # `npm view`); Sigstore (fulcio, rekor: attestations and npm provenance). A blocked call fails the job and shows in
      # the harden-runner log: add that exact host in a pull request, or set `audit` as the documented fallback
      # (docs/dev/releasing.md). Never a wildcard (scripts/test/release.test.ts).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            token.actions.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$MODE" == publish || "$MODE" == release ]] || { echo "::error::bad mode"; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad artifact id"; exit 1; }
          [[ "$SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum digest"; exit 1; }
          # `latest` only from main; a release/x.y backport only as `release-x.y` with an x.y.* version (P8-68).
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            [[ "$NPM_TAG" == latest ]] || { echo "::error::main publishes with the latest tag only"; exit 1; }
          else
            [[ "$GITHUB_REF" =~ ^refs/heads/release/([0-9]+)\.([0-9]+)$ ]] || { echo "::error::bad ref"; exit 1; }
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            [[ "$NPM_TAG" == "release-${line}" && "$VERSION" == "${line}".* ]] || {
              echo "::error::a backport from release/${line} publishes ${line}.x as release-${line} only"; exit 1
            }
          fi
      # Downloads by id from this run; the action fails on an artifact digest mismatch.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist-release
          merge-multiple: true
      - name: Verify the checksums
        working-directory: dist-release/release
        run: |
          echo "${SUMS_SHA256}  SHA256SUMS" | sha256sum -c --strict -
          sha256sum -c --strict SHA256SUMS
          # Every file is covered by SHA256SUMS, and the tarball is there.
          test "$(find . -type f ! -name SHA256SUMS | wc -l)" = "$(wc -l < SHA256SUMS)"
          test -f "agility-bridge-${VERSION}.tgz"
      - name: Refuse a v<version> tag on another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" 2>"$RUNNER_TEMP/gh-err.txt")" || {
            grep -q 'HTTP 404' "$RUNNER_TEMP/gh-err.txt" || { cat "$RUNNER_TEMP/gh-err.txt" >&2; exit 1; }
            echo "tag v${VERSION} does not exist yet"; exit 0
          }
          for _ in 1 2 3 4 5; do
            type="$(jq -r .object.type <<<"$ref")"; sha="$(jq -r .object.sha <<<"$ref")"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected tag data"; exit 1; }
            [[ "$type" == tag ]] || break
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '{object: .object}')"
          done
          [[ "$type" == commit && "$sha" == "$GITHUB_SHA" ]] || {
            echo "::error::tag v${VERSION} points at ${type} ${sha}, not ${GITHUB_SHA}"; exit 1
          }
      # Decided here, not only by `plan`: "Re-run failed jobs" reuses the old plan outputs, so a rerun after a failed
      # `gh release create` arrives with mode `publish` for a version that is already on npm.
      - id: npm
        name: Already on npm? Then the tarball must be identical
        working-directory: dist-release/release
        run: |
          if published="$(npm view "agility-bridge@${VERSION}" dist.integrity 2>"$RUNNER_TEMP/npm-err.txt")"; then :; else
            grep -q E404 "$RUNNER_TEMP/npm-err.txt" || { cat "$RUNNER_TEMP/npm-err.txt" >&2; exit 1; }
            published=""
          fi
          if [[ -z "$published" ]]; then
            [[ "$MODE" == publish ]] || { echo "::error::mode release but agility-bridge@${VERSION} is not on npm"; exit 1; }
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rebuilt="sha512-$(openssl dgst -sha512 -binary "agility-bridge-${VERSION}.tgz" | base64 -w0)"
          [[ "$published" == "$rebuilt" ]] || {
            echo "::error::rebuilt tarball differs from agility-bridge@${VERSION} on npm; finish the release by hand"
            exit 1
          }
          echo "agility-bridge@${VERSION} is already on npm with this tarball; only the GitHub Release is missing"
          echo "published=true" >> "$GITHUB_OUTPUT"
      # One bundle covers the tarball, SBOM and checksums. It is also uploaded to the GitHub Release as
      # `agility-bridge-<v>.intoto.jsonl` (P8-54): OpenSSF Scorecard (Signed-Releases) only recognises a signature or
      # provenance file among the release assets. `actions/attest-build-provenance` is a thin wrapper of
      # `actions/attest` (same version), so this step already is the build provenance attestation.
      - id: provenance
        name: Attest build provenance (tarball, SBOM, checksums)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-release/release/*
      - name: Attest SBOM (tarball)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-release/release/agility-bridge-${{ needs.plan.outputs.version }}.tgz
          sbom-path: dist-release/release/agility-bridge-${{ needs.plan.outputs.version }}.cdx.json
      # npm >= 11.15.0 (checked in the step; Node 24 bundles npm 11) stages the tarball with the OIDC token;
      # `npm stage publish` never goes live on its own. A maintainer approves it with
      # 2FA on npmjs.com (`npm stage approve` cannot use OIDC), and only then is the version public. The trusted
      # publisher must allow `npm stage publish` (docs/dev/releasing.md); the workflow never calls `npm publish`.
      # --ignore-scripts: nothing from the tarball runs here. The tarball path is absolute (npm reads a relative
      # `a/b.tgz` as a git shorthand).
      # Rerun while the version is staged and not approved: npm refuses a second stage of the same version (staged
      # and published versions share one version index), which is reported as "awaiting approval" and ends the job
      # successfully without a GitHub Release. After approval, run the workflow again: `plan` finds the version on
      # npm without a GitHub Release (mode `release`) and only creates the Release.
      - name: Stage on npm (trusted publishing, provenance; approval on npmjs.com)
        if: steps.npm.outputs.published == 'false'
        run: |
          npm_version="$(npm --version)"
          [[ "$(printf '%s\n11.15.0\n' "$npm_version" | sort -V | head -n1)" == 11.15.0 ]] || {
            echo "::error::npm ${npm_version} is too old for staged publishing (needs >= 11.15.0)"; exit 1
          }
          out="$RUNNER_TEMP/stage-out.txt"
          integrity="sha512-$(openssl dgst -sha512 -binary "dist-release/release/agility-bridge-${VERSION}.tgz" | base64 -w0)"
          summary() { printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          if npm stage publish "${PWD}/dist-release/release/agility-bridge-${VERSION}.tgz" \
            --tag "$NPM_TAG" --provenance --access public --ignore-scripts >"$out" 2>&1; then
            cat "$out"
            summary "agility-bridge@${VERSION} is **staged, not published**. Approve it with 2FA on npmjs.com (Staged Packages) after checking its integrity is \`${integrity}\`, then run this workflow again to create the GitHub Release."
            echo "::notice::agility-bridge@${VERSION} is staged; approve it on npmjs.com, then run this workflow again"
            exit 0
          fi
          cat "$out" >&2
          if grep -Eqi 'E409|EPUBLISHCONFLICT|already (exists|staged)|cannot publish over|previously published|version conflict' "$out"; then
            summary "agility-bridge@${VERSION} was already staged by an earlier run and awaits approval on npmjs.com (integrity of this build: \`${integrity}\`). Nothing was staged again."
            echo "::notice::agility-bridge@${VERSION} is already staged and awaiting approval on npmjs.com; nothing staged again"
            exit 0
          fi
          echo "::error::npm stage publish failed"; exit 1
      # Only once the version is live on npm (approved): a staged version has no public tarball to release yet.
      - name: GitHub Release
        if: steps.npm.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          if draft="$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$draft" == false ]] || { echo "::error::a draft release v${VERSION} exists; delete it and rerun"; exit 1; }
            echo "GitHub Release v${VERSION} already exists"; exit 0
          fi
          # The Sigstore bundle as one JSON line (`.intoto.jsonl`); `gh attestation verify` can use it offline with
          # `--bundle`. Kept outside dist-release/release, which SHA256SUMS covers.
          mkdir -p dist-release/provenance
          jq -c . "$BUNDLE_PATH" > "dist-release/provenance/agility-bridge-${VERSION}.intoto.jsonl"
          # A backport is never the repository's "Latest" release (GitHub would otherwise pick the newest one created).
          latest=true; [[ "$NPM_TAG" == latest ]] || latest=false
          gh release create "v${VERSION}" dist-release/release/* \
            "dist-release/provenance/agility-bridge-${VERSION}.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" \
            --latest="$latest" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file dist-release/release-meta/release-notes.md

  # The release image (P2-18, D-25): built from the release commit as one multi-architecture OCI archive, then the
  # linux/amd64 image from that archive is smoke-tested and scanned like CI does. No registry credentials and no
  # id-token here; pushing is the `image` job's only task.
  image-build:
    name: Build the release image
    needs: plan
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      vars.AB_RELEASE_ENABLED == 'true' &&
      (needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      image-sha256: ${{ steps.archive.outputs.image-sha256 }}
      tags: ${{ steps.tags.outputs.tags }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: 0.75.0
      # sha256 of the Linux-64bit tarball, pinned here so a tampered release cannot also replace its checksums file.
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Re-check the planned version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          test "$(node -p 'require("./apps/cli/package.json").version')" = "$VERSION"
      - run: pnpm install --frozen-lockfile
      # X.Y and latest never move backwards (L-128): computed from the versions on npm, tested in release.test.ts.
      - id: tags
        name: Image tags
        shell: bash
        run: node scripts/release.ts image-tags "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: archive
        name: Build linux/amd64 and linux/arm64 as one OCI archive
        run: |
          mkdir -p dist-image
          docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile \
            --build-arg "VERSION=${VERSION}" --build-arg "REVISION=${GITHUB_SHA}" \
            --output "type=oci,dest=dist-image/agility-bridge-${VERSION}.oci.tar" .
          cd dist-image && sha256sum -- * > IMAGE_SHA256SUMS && cat IMAGE_SHA256SUMS
          echo "image-sha256=$(sha256sum IMAGE_SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The image that is pushed, not a rebuild: linux/amd64 out of the archive into the local daemon.
      - name: Smoke test and scan the archived linux/amd64 image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:dist-image/agility-bridge-${VERSION}.oci.tar" docker-daemon:agility-bridge:release
          node --conditions=source scripts/docker-smoke.ts agility-bridge:release
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$file"
          echo "${TRIVY_SHA256}  $file" | sha256sum -c --strict -
          tar xzf "$file" trivy
          ./trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 agility-bridge:release
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ needs.plan.outputs.version }}
          path: dist-image/
          if-no-files-found: error
          retention-days: 7

  # Pushes the verified archive to GHCR and attests it (P2-18, D-25). Like `publish`: no checkout, no install, no
  # project code. It waits for the same `release` environment as `publish` (both wait together, so one approval covers
  # both) and pushes only once the version is live on npm, so the image never runs ahead of the package: in the run
  # that stages the version it stops with a notice, and the run after the npm approval (mode `release`) pushes it.
  # Reruns are idempotent: an existing X.Y.Z tag is kept (never pushed over) and only re-tagged and attested.
  image:
    name: Publish the image to GHCR
    needs: [plan, build, image-build]
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
      vars.AB_RELEASE_ENABLED == 'true' &&
      (needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/mhidalgo-lab/agility-bridge/pkgs/container/agility-bridge
    permissions:
      packages: write # push to ghcr.io/mhidalgo-lab/agility-bridge and its attestations
      id-token: write # Sigstore attestations
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/mhidalgo-lab/agility-bridge
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.image-build.outputs.tags }}
      IMAGE_ARTIFACT_ID: ${{ needs.image-build.outputs.artifact-id }}
      IMAGE_SHA256: ${{ needs.image-build.outputs.image-sha256 }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
    steps:
      # Egress blocked like `publish`. Classes: GitHub API (api); GHCR and its blob storage (ghcr.io,
      # pkg-containers.githubusercontent.com); OIDC token (token.actions); npm (registry, `npm view`); Sigstore (fulcio,
      # rekor). A blocked call fails the job and shows in the harden-runner log (docs/dev/releasing.md).
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the inputs
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$IMAGE_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad artifact id"; exit 1; }
          [[ "$SUMS_SHA256" =~ ^[0-9a-f]{64}$ && "$IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad digest"; exit 1; }
          IFS=, read -ra refs <<<"$TAGS"
          [[ "${refs[0]:-}" == "${IMAGE}:${VERSION}" ]] || { echo "::error::the first tag must be ${IMAGE}:${VERSION}"; exit 1; }
          for r in "${refs[@]}"; do
            [[ "$r" =~ ^ghcr\.io/mhidalgo-lab/agility-bridge:([0-9]+\.[0-9]+(\.[0-9]+(-[0-9A-Za-z.-]+)?)?|latest)$ ]] || {
              echo "::error::unexpected image reference ${r}"; exit 1
            }
            # A backport never moves latest (L-128).
            [[ "$r" != "${IMAGE}:latest" || "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::latest only from main"; exit 1; }
          done
      - id: npm
        name: Live on npm? (the image never runs ahead of the package)
        run: |
          if npm view "agility-bridge@${VERSION}" version >"$RUNNER_TEMP/npm-out.txt" 2>"$RUNNER_TEMP/npm-err.txt" \
            && [[ -s "$RUNNER_TEMP/npm-out.txt" ]]; then
            echo "live=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -q E404 "$RUNNER_TEMP/npm-err.txt" 2>/dev/null || [[ ! -s "$RUNNER_TEMP/npm-err.txt" ]] || {
            cat "$RUNNER_TEMP/npm-err.txt" >&2; exit 1
          }
          echo "::notice::agility-bridge@${VERSION} is not live on npm yet; the run after its approval publishes the image"
          echo "live=false" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.npm.outputs.live == 'true'
        with:
          artifact-ids: ${{ needs.image-build.outputs.artifact-id }},${{ needs.build.outputs.artifact-id }}
          path: dist-release
          merge-multiple: true
      - name: Verify the checksums
        if: steps.npm.outputs.live == 'true'
        working-directory: dist-release
        run: |
          echo "${IMAGE_SHA256}  IMAGE_SHA256SUMS" | sha256sum -c --strict -
          sha256sum -c --strict IMAGE_SHA256SUMS
          test -f "agility-bridge-${VERSION}.oci.tar"
          cd release
          echo "${SUMS_SHA256}  SHA256SUMS" | sha256sum -c --strict -
          sha256sum -c --strict SHA256SUMS
          test -f "agility-bridge-${VERSION}.cdx.json"
      - id: push
        name: Push to GHCR (an existing version tag is never overwritten)
        if: steps.npm.outputs.live == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          raw="$RUNNER_TEMP/manifest.json"
          if skopeo inspect --raw "docker://${IMAGE}:${VERSION}" >"$raw" 2>"$RUNNER_TEMP/skopeo-err.txt"; then
            digest="sha256:$(sha256sum "$raw" | cut -d' ' -f1)"
            echo "::notice::${IMAGE}:${VERSION} already exists (${digest}); not pushed again"
          else
            grep -Eqi 'manifest unknown|not found|name unknown' "$RUNNER_TEMP/skopeo-err.txt" || {
              cat "$RUNNER_TEMP/skopeo-err.txt" >&2; exit 1
            }
            skopeo copy --all --digestfile "$RUNNER_TEMP/digest" \
              "oci-archive:dist-release/agility-bridge-${VERSION}.oci.tar" "docker://${IMAGE}:${VERSION}"
            digest="$(cat "$RUNNER_TEMP/digest")"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest"; exit 1; }
          IFS=, read -ra refs <<<"$TAGS"
          for r in "${refs[@]:1}"; do skopeo copy --all "docker://${IMAGE}@${digest}" "docker://${r}"; done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "Pushed \`${IMAGE}@${digest}\` as ${TAGS}." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Attest build provenance (image)
        if: steps.npm.outputs.live == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/mhidalgo-lab/agility-bridge
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The application SBOM (the npm package's production dependencies, which is what /app holds).
      - name: Attest SBOM (image)
        if: steps.npm.outputs.live == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/mhidalgo-lab/agility-bridge
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist-release/release/agility-bridge-${{ needs.plan.outputs.version }}.cdx.json
          push-to-registry: true
