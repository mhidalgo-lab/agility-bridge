# Staging smoke checks (P3-11): what anyone on the internet sees of a deployed agility-bridge, without credentials —
# health and version with the security headers, the uniform 401, the admin API closed, unknown paths, a hostile Origin
# (scripts/staging-smoke.ts). Run by hand with the deployment's address; it needs no secret and changes nothing.
name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'The deployment, e.g. https://agility-bridge-staging.<subdomain>.workers.dev'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Smoke checks
        env:
          SMOKE_URL: ${{ inputs.url }}
        run: |
          [[ "$SMOKE_URL" =~ ^https://[a-z0-9.-]+(:[0-9]+)?/?$ ]] || { echo "::error::url must be https://<host>"; exit 1; }
          node scripts/staging-smoke.ts "$SMOKE_URL"
