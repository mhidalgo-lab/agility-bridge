# Admin panel in a real browser and an OWASP ZAP baseline scan (P4-08). Neither job is a required check (a path-filtered
# workflow cannot be: it would never report on a pull request that does not touch these paths). They run on pull requests
# and pushes to main that touch the panel, sign-in, the admin API, the CLI or the E2E files, every Monday, and on demand.
# No secrets: the identity provider, the synthetic Agility and every key are loopback fakes made at run time, and the ZAP
# scan only ever targets that throw-away server. Run them locally with `pnpm test:e2e` and `pnpm scan:zap`
# (docs/dev/testing.md).
name: Admin E2E and ZAP

on:
  pull_request:
    paths:
      - 'packages/admin-ui/**'
      - 'packages/http-app/**'
      - 'packages/auth/**'
      - 'packages/storage/**'
      - 'packages/storage-sqlite/**'
      - 'packages/core/src/agility/**'
      - 'packages/core/test/fixtures/**'
      - 'packages/core/test/harness/**'
      - 'apps/cli/**'
      - 'e2e/**'
      - '.zap/**'
      - 'scripts/fixture-agility.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/admin-ui/**'
      - 'packages/http-app/**'
      - 'packages/auth/**'
      - 'packages/storage/**'
      - 'packages/storage-sqlite/**'
      - 'packages/core/src/agility/**'
      - 'packages/core/test/fixtures/**'
      - 'packages/core/test/harness/**'
      - 'apps/cli/**'
      - 'e2e/**'
      - '.zap/**'
      - 'scripts/fixture-agility.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin-e2e.yml'
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Admin browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        # The apt mirror sometimes serves a few KB/s (first run: 5 minutes for 8 packages).
        timeout-minutes: 15
      - name: Run the browser tests
        run: pnpm test:e2e
        timeout-minutes: 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          # The HTML report and, for failures, the traces (they hold only fake data and loopback addresses).
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  zap:
    name: Admin ZAP baseline (loopback)
    # A hosted runner: the scan runs ZAP in Docker on the host network with a bind-mounted report directory, which
    # needs the Docker daemon on the machine that runs the job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Scan (fails on an unreviewed Medium or High alert)
        run: pnpm scan:zap
        timeout-minutes: 25
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-reports
          path: zap-reports/*.html
          if-no-files-found: ignore
          retention-days: 14
