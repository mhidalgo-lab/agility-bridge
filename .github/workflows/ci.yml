# CI (P0-03). Actions are pinned by commit SHA; scripts/check-workflows.ts (in `pnpm lint`) enforces the hardening rules.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node comes first: pnpm/action-setup runs on the node on PATH, which is too old on a fresh runner.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The CLI and the node:sqlite adapter on the other OSes the CLI supports (L-104). harden-runner supports Linux only.
  os:
    name: SQLite and CLI (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project storage-sqlite --project cli
      - run: pnpm --filter agility-bridge build
      - run: node apps/cli/dist/index.mjs

  # The self-hosting image (P2-11): build, smoke test against the synthetic Agility, vulnerability scan, and a
  # multi-architecture build. Nothing is pushed: publishing the image is a release step that needs the owner.
  docker:
    name: Docker image (build, smoke test, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: 0.75.0
      # sha256 of the Linux-64bit tarball, pinned here so a tampered release cannot also replace its checksums file.
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: docker build -f docker/Dockerfile --build-arg "REVISION=${GITHUB_SHA}" -t agility-bridge:ci .
      - run: node --conditions=source scripts/docker-smoke.ts agility-bridge:ci
      - name: Scan the image (no fixable high or critical findings)
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$file"
          echo "${TRIVY_SHA256}  $file" | sha256sum -c --strict -
          tar xzf "$file" trivy
          ./trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 agility-bridge:ci
      # The self-hosting guides, executed in a fresh container from the packed package (P2-16, L-133).
      - name: Self-hosting walkthrough
        run: |
          pnpm --filter agility-bridge build
          mkdir -p "$RUNNER_TEMP/pkg"
          (cd apps/cli && npm pack --pack-destination "$RUNNER_TEMP/pkg")
          node --conditions=source scripts/walkthrough.ts "$RUNNER_TEMP"/pkg/agility-bridge-*.tgz
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for linux/amd64 and linux/arm64 (no push)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile .

  # CPU of the Worker's code paths (P3-10): not required; a path more than 2× its baseline is flagged as a warning
  # annotation, and the numbers are kept as an artifact (history).
  bench:
    name: Worker CPU benchmark (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Benchmark
        run: |
          set -o pipefail
          pnpm -s bench:worker | tee worker-bench.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worker-bench-${{ github.sha }}
          path: worker-bench.json
          retention-days: 90

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # renovate: datasource=github-release-attachments depName=rhysd/actionlint
      ACTIONLINT_VERSION: v1.7.12
      # sha256 of the linux/amd64 tarball, pinned here so a tampered release cannot also replace its checksums file.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned checksum) and lint workflows
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$file"
          echo "${ACTIONLINT_SHA256}  $file" | sha256sum -c --strict -
          tar -xzf "$file" actionlint
          ./actionlint -color

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit has a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $c is missing a DCO Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
