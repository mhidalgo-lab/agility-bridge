# Metadata drift (P1-03, L-053): the committed synthetic meta.v1 snapshot against Digital.ai's public example instance.
# meta.v1 is public there (schema only, no token, no tenant data), so the job needs no secrets and its logs are safe.
# Weekly and on demand; never on pull requests, so an outage of the example instance never blocks a merge.
name: Metadata drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-drift
  cancel-in-progress: true

jobs:
  drift:
    name: Snapshot vs public example instance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/metadata-drift.ts
